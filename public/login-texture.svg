<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Simple repeating black-on-black texture for the login brand panel:
       faint diagonal cross-hatch + corner dot, tiled via background-repeat. -->
  <rect width="48" height="48" fill="#0a0a0a"/>
  <path d="M0 48 L48 0" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <path d="M-12 48 L36 0" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
  <path d="M12 48 L60 0" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
  <circle cx="24" cy="24" r="1" fill="#10b981" fill-opacity="0.16"/>
</svg>
